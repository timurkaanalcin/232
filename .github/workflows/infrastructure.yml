name: Infrastructure Bootstrap

# One-time or manual full provisioning. Day-to-day deploys use deploy.yml on push.
on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Apply remote D1 migrations
        type: boolean
        default: true
      sync_secrets:
        description: Sync secrets from GitHub to Cloudflare Worker
        type: boolean
        default: true
      deploy:
        description: Build and deploy Worker
        type: boolean
        default: true
      create_admin:
        description: Create/update super admin (needs ADMIN_EMAIL + ADMIN_PASSWORD secrets)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision D1 database
        run: node scripts/infra/provision-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Cloudflare secrets
        if: inputs.sync_secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: node scripts/infra/sync-secrets.mjs --remote

      - name: Apply D1 migrations
        if: inputs.run_migrations
        run: npx wrangler d1 migrations apply livetrack-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build & deploy
        if: inputs.deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create super admin
        if: inputs.create_admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "ADMIN_EMAIL or ADMIN_PASSWORD not set — skipping"
            exit 0
          fi
          node scripts/create-admin.mjs \
            --email "$ADMIN_EMAIL" \
            --password "$ADMIN_PASSWORD" \
            --remote

      - name: Post-deploy health check
        if: inputs.deploy
        env:
          AUTH_URL: ${{ secrets.AUTH_URL }}
        run: |
          if [ -z "$AUTH_URL" ]; then
            echo "AUTH_URL not set — skipping health check"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            if curl -fsS "${AUTH_URL}/api/health"; then
              exit 0
            fi
            echo "Waiting for deployment... ($i/5)"
            sleep 15
          done
          echo "Health check failed"
          exit 1
