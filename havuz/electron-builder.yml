appId: com.havuz.chat
productName: llvadAI
copyright: Timur Kaan Alçin
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
asar: true
forceCodeSigning: false
win:
  target:
    - nsis
  icon: build/icon.png
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: llvadAI-Setup-${version}.exe
mac:
  target:
    - dmg
  icon: build/icon.png
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: llvadAI-${version}.dmg
linux:
  target:
    - AppImage
  icon: build/icon.png
